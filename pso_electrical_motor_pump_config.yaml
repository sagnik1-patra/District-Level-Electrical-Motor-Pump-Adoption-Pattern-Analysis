project:
  name: PSO-Based District-Level Electrical Motor Pump Adoption Pattern Analysis
  optimization: Binary Particle Swarm Optimization
  random_state: 42
dataset:
  path: C:\Users\sagni\Downloads\District-Level Electrical Motor Pump Adoption Pattern
    Analysis\5.49.csv
  rows: 39
  columns: 9
  target: Electrical Motor Pump Use (%)
pso:
  swarm_size: 30
  iterations: 30
  inertia_max: 0.9
  inertia_min: 0.4
  cognitive_coefficient: 2.0
  social_coefficient: 2.0
  best_fitness: 0.9874999999999999
  features_before: 4
  features_after: 1
  selected_features:
  - 'No'
model:
  type: PSO Optimized Feedforward Neural Network
  framework: TensorFlow Keras
  classes:
  - High Adoption
  - Low Adoption
  - Moderate Adoption
  accuracy: 0.9
  precision: 0.8099999999999999
  recall: 0.9
  f1_score: 0.8526315789473683
clustering:
  algorithm: KMeans
  clusters: 3
  silhouette_score: 0.9910134310134308
